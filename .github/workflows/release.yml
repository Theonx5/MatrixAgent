name: Release desktop installers

on:
  push:
    tags: ["v*", "agent-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.1)"
        required: true

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            label: Windows x64
            runner: windows-2022
          - id: macos-arm64
            label: macOS Apple Silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/cache@v5
        with:
          path: .runtime-cache
          key: ${{ runner.os }}-${{ runner.arch }}-release-runtime-${{ hashFiles('scripts/release-runtime.lock.json') }}
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          values=(
            "$APPLE_CERTIFICATE"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_SIGNING_IDENTITY_SECRET"
            "$APPLE_ID"
            "$APPLE_PASSWORD"
            "$APPLE_TEAM_ID"
            "$KEYCHAIN_PASSWORD"
          )
          present=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "PIDECK_MACOS_SIGNING_MODE=ad-hoc" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$present" -ne "${#values[@]}" ]]; then
            echo "Apple release secrets must be configured as a complete set." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/pideck-build.keychain-db"
          certificate="$RUNNER_TEMP/pideck-developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          echo "PIDECK_MACOS_SIGNING_MODE=developer-id" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Record verified source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Verified source commit ${commit} for tag ${RELEASE_TAG}"
      - name: Verify Windows source gate
        if: runner.os == 'Windows'
        run: pnpm verify:p0
      - name: Verify macOS JavaScript source
        if: runner.os == 'macOS'
        run: pnpm verify:quick && pnpm build
      - name: Restore files generated during verify
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain || true
          git restore --worktree --source=HEAD -- .
          git status --porcelain || true
      - name: Detect SignPath
        if: runner.os == 'Windows'
        id: signpath
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGNPATH_API_TOKEN" && -n "$SIGNPATH_ORGANIZATION_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "project_slug=${SIGNPATH_PROJECT_SLUG:-matrix-agent}" >> "$GITHUB_OUTPUT"
            echo "policy_slug=${SIGNPATH_SIGNING_POLICY_SLUG:-release-signing}" >> "$GITHUB_OUTPUT"
            echo "PIDECK_SKIP_WINDOWS_AUTHENTICODE=1" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SignPath secrets are not set; Windows installer will stay self-signed."
          fi
      - name: Package from the verified source commit
        env:
          PIDECK_VERIFIED_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          PIDECK_WINDOWS_CERT_THUMBPRINT: ${{ secrets.PIDECK_WINDOWS_CERT_THUMBPRINT }}
        run: pnpm package:release
      - name: Stage unsigned Windows installer
        if: runner.os == 'Windows' && steps.signpath.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installer="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const m = JSON.parse(readFileSync('apps/desktop/src-tauri/target/release-staging/PACKAGE_RELEASE.json', 'utf8')); process.stdout.write(m.sourceInstaller)")"
          mkdir -p unsigned-windows
          cp "$installer" unsigned-windows/
      - name: Upload unsigned Windows installer
        if: runner.os == 'Windows' && steps.signpath.outputs.enabled == 'true'
        id: unsigned-windows
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installer
          path: unsigned-windows
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows installer with SignPath
        if: runner.os == 'Windows' && steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ steps.signpath.outputs.project_slug }}
          signing-policy-slug: ${{ steps.signpath.outputs.policy_slug }}
          github-artifact-name: unsigned-windows-installer
          wait-for-completion: true
          output-artifact-directory: signed-windows
      - name: Bind SignPath signature into the updater feed
        if: runner.os == 'Windows' && steps.signpath.outputs.enabled == 'true'
        shell: bash
        run: node scripts/apply-windows-signpath.mjs --signed-dir signed-windows
      - name: Confirm package manifest source commit
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          manifest="apps/desktop/src-tauri/target/release-staging/PACKAGE_RELEASE.json"
          COMMIT="$commit" MANIFEST="$manifest" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const commit = process.env.COMMIT;
            const manifest = JSON.parse(readFileSync(process.env.MANIFEST, "utf8"));
            if (manifest.sourceCommit !== commit) {
              console.error(`sourceCommit ${manifest.sourceCommit} !== ${commit}`);
              process.exit(1);
            }
            if (manifest.reusedSourceBuildCommit !== commit) {
              console.error(`reusedSourceBuildCommit ${manifest.reusedSourceBuildCommit} !== ${commit}`);
              process.exit(1);
            }
            console.log(`PACKAGE_RELEASE.json records source commit ${commit}`);
          '
      - name: Stage accepted platform assets
        shell: bash
        run: node scripts/generate-update-manifest.mjs --stage-platform --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-platform-${{ matrix.id }}
          path: apps/desktop/src-tauri/target/release-staging/github-release-platform
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create draft release
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-platform-*
          path: release-input
          merge-multiple: true
      - name: Generate cross-platform updater feed
        shell: bash
        run: |
          node scripts/generate-update-manifest.mjs \
            --tag "$RELEASE_TAG" \
            --input-dir release-input \
            --output-dir release-output
      - name: Create or update draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-output/*)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"
            gh release edit "$RELEASE_TAG" --draft --title "PaperMatrix $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "PaperMatrix $RELEASE_TAG" \
              --generate-notes \
              "${assets[@]}"
          fi

  publish-to-server:
    name: Publish updater feed to papermatrix.online
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
    steps:
      # 国内直连 GitHub Release 不稳且草稿 Release 资产免登录不可下载，
      # 客户端 updater 端点在 papermatrix.online，故把产物回流到自建服务器。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Download release assets
        run: |
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -D artifacts
      - name: Assemble dist (latest.json + version dir)
        run: |
          python3 scripts/publish.py \
            --artifacts artifacts \
            --version "${RELEASE_TAG#v}" \
            --base-url "https://papermatrix.online" \
            --target dist \
            --notes "PaperMatrix ${RELEASE_TAG}"
      - name: Upload to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.DEPLOY_SERVER_HOST }}" >> ~/.ssh/known_hosts
          # 只增不删：旧版本目录保留，支持回滚
          rsync -avz -e "ssh -p $SSH_PORT" dist/ "${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:${{ secrets.DEPLOY_DIST_DIR }}/"
      - name: Self check
        run: |
          VERSION="${RELEASE_TAG#v}"
          curl -fsS "https://papermatrix.online/api/updates/matrix-agent/latest.json" | grep -q "\"version\": \"$VERSION\""
          echo "publish OK: $VERSION"
